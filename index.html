<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet " href="style.css">
    <script src="insert.js" defer></script> 
    <!-- the defer may maynot be needed -->
</head>

<body>
    <ul class = "sidebar">
        <li class="menu-item dashboard"><img src="./svg/view-dashboard.svg">Dashboard</li>
        <li class="menu-item"></li>
        <li class="menu-item"><img src="./svg/home.svg">Home</li>
        <li class="menu-item"><img src="./svg/card-account-details-outline.svg">Profile</li>
        <li class="menu-item"><img src="./svg/message.svg">Messages</li>
        <li class="menu-item"><img src="./svg/history.svg">History</li>
        <li class="menu-item"><img src="./svg/file-document-multiple.svg">Tasks</li>
        <li class="menu-item"><img src="./svg/account-group.svg">Communities</li>
        <li class="menu-item"></li>
        <li class="menu-item"><img src="./svg/cog.svg">Settings</li>
        <li class="menu-item"><img src="./svg/help-box.svg">Support</li>
        <li class="menu-item"><img src="./svg/shield-check.svg">Privacy</li>
    </ul>

    <div class = "topbar">
        <div class="head">
            <div class = "left-search"> 
                <img src="./svg/magnify.svg">
                <div class = "search-window"></div>
            </div>
            <div class="right-avatar">
                <img src="./svg/bell-ring-outline.svg">
                <img class = "avatar" src="./avatars/aang.jpeg">
                <div>Avatar Aang</div>
            </div>
            
        </div>
        <div class = "bottom">
            <div class = "left-avatar">   
                <img class = "big-avatar" src="./avatars/aang.jpeg">
                <div>Avatar Aang(@aang)</div>
            </div>
         
            <div class="right-buttons">
                <div class="button">New</div>
                <div class="button">Upload</div>
                <div class="button">Share</div>
            </div>
        </div>
    </div>
    <div class="projects"></div>
</body>
</html>
